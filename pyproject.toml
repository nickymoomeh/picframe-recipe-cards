[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "picframe-recipe-cards"
version = "0.4.0"
description = "Standalone, offline-capable recipe cards for picframe3"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4,<14", "qrcode>=7.4,<9", "beautifulsoup4>=4.12,<5"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
recipe-card = "recipe_cards.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
